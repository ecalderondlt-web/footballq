experiment: latent_flow_residual_last_small
seed: 123
data:
  rollout_dataset: data/processed/skillcorner_latent_rollout_dataset.pt
model:
  name: residual_latent_flow_mlp
  latent_dim: 128
  context_len: 5
  horizon_len: 5
  hidden_dim: 64
  num_layers: 2
  dropout: 0.0
  time_embed_dim: 32
  conditioning: past_z_flat
flow:
  target_mode: residual
  residual_mode: last_latent
  num_sampling_steps: 5
  noise_scale: 0.0
  deterministic_mean_eval: true
training:
  batch_size: 256
  max_epochs: 1
  max_train_batches: 10
  max_val_batches: 10
  save_every_steps: 5
  learning_rate: 0.0005
  weight_decay: 0.00001
  seed: 123
  grad_clip_norm: 1.0
  num_workers: 0
  device: auto
  run_root: runs
  best_metric: loss
sampling:
  num_samples: 4
  num_steps: 5
  noise_scale: 0.0
