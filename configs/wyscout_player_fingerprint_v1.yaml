experiment_protocol: wyscout_cross_team_player_fingerprint_v1

data:
  dataset_root: data/processed/wyscout_player_memory_v1
  dataset_manifest: data/processed/wyscout_player_memory_v1/manifest.json
  development_manifest: splits/wyscout_player_fingerprint_club_to_world_cup_v1.json
  confirmatory_manifest: splits/wyscout_player_fingerprint_euro_to_club_confirmatory_v1.json
  confirmatory_protocol_doc: docs/WYSCOUT_CROSS_TEAM_FINGERPRINT_CONFIRMATORY_PROTOCOL_V1.md
  confirmatory_freeze_manifest: provenance/wyscout_player_fingerprint_confirmatory_freeze_v1.json

development:
  name: club_2017_18_to_world_cup_2018
  support_competitions:
    - England
    - France
    - Germany
    - Italy
    - Spain
  query_competitions:
    - World_Cup
  support_min_matches: 5
  support_min_passes: 100
  query_min_matches: 1
  query_min_passes: 20
  support_match_caps:
    - 1
    - 3
    - 5
    - 10
    - 20
  main_support_match_cap: 20
  status: development_metric_opened

confirmatory:
  name: euro_2016_to_club_2017_18
  support_competitions:
    - European_Championship
  query_competitions:
    - England
    - France
    - Germany
    - Italy
    - Spain
  support_min_matches: 1
  support_min_passes: 20
  query_min_matches: 5
  query_min_passes: 100
  support_match_caps:
    - 1
    - 3
    - 5
  main_support_match_cap: 5
  status: metric_sealed

profile:
  feature_view: behavior_72
  ablation_views:
    - full_75
    - summary_behavior_22
    - spatial_50
    - outcome_3
  standardization: support_only_zscore
  role_residualization: support_role_mean
  normalization: l2
  distance: cosine
  role_codes:
    - goalkeeper
    - defender
    - midfielder
    - forward
    - unknown

evaluation:
  candidate_sets:
    - same_role
    - same_support_team_and_role
    - same_query_team_and_role
  bootstrap_unit: player_id
  bootstrap_replicates: 5000
  confidence_level: 0.95
  bootstrap_seed: 20260729

development_gate:
  minimum_same_role_pairwise_auc: 0.70
  minimum_same_role_top1_chance_multiple: 10.0
  minimum_support_team_top1_chance_multiple: 2.0
  minimum_query_team_top1_chance_multiple: 2.0
  require_positive_player_bootstrap_lower_bounds: true
  require_positive_main_mrr_gain_lower_bound: true

confirmatory_gate:
  minimum_same_role_pairwise_auc: 0.65
  minimum_same_role_top1_chance_multiple: 5.0
  minimum_support_team_top1_chance_multiple: 1.5
  minimum_query_team_top1_chance_multiple: 1.5
  require_positive_player_bootstrap_lower_bounds: true
  require_positive_main_mrr_gain_lower_bound: true
