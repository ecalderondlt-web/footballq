  profile_prior_strengths: [1.0, 3.0, 10.0, 30.0]

evaluation:
  match_bootstrap_samples: 2000
  bootstrap_seed: 20260729
  shuffle_seed: statsbomb-recipient-tournament-same-role-v1

gates:
  minimum_nll_improvement_fraction: 0.005
  minimum_top3_gain: 0.02
  require_positive_match_bootstrap_mean: true
  require_positive_match_bootstrap_ci: true
  require_profile_better_than_same_role_shuffle: true

output:
  run_dir: runs/statsbomb_recipient_tournament_transfer_v1
