experiment: td_jepa_gfootball_temporal_match_invariant
seed: 7
data:
  path: data/processed/gfootball_td_jepa_nonoverlap_geometry.pt
  source: gfootball
  fps_out: 10
  context_seconds: 1.0
  delta_seconds: 0.2
  stride_seconds: 0.2
  objective_mode: future_nonoverlap_context_only
  prediction_gap_seconds: 1.0
  feature_view: geometry_only
split:
  val_fraction: 0.1
  test_fraction: 0.1
model:
  z_dim: 128
  d_model: 128
  n_layers: 2
  n_heads: 4
  dropout: 0.1
  pooling: temporal_gru
  motion_hidden_dim: 256
  state_decoder_hidden_dim: 256
  temporal_motion_head_hidden_dim: 128
ema:
  momentum: 0.996
loss:
  variance_weight: 1.0
  variance_threshold: 0.05
  slot_reconstruction_weight: 0.25
  context_reconstruction_weight: 0.05
  no_motion_margin_weight: 0.1
  no_motion_margin: 0.01
  temporal_motion_weight: 0.25
  match_invariance_weight: 5.0
training:
  seed: 7
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 5
  num_workers: 0
  device: auto
  run_root: runs
  best_metric: total_loss
