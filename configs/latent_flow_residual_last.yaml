experiment: latent_flow_residual_last
seed: 123
data:
  rollout_dataset: data/processed/skillcorner_latent_rollout_dataset.pt
model:
  name: residual_latent_flow_mlp
  latent_dim: 128
  context_len: 5
  horizon_len: 5
  hidden_dim: 256
  num_layers: 4
  dropout: 0.1
  time_embed_dim: 64
  conditioning: past_z_gru
flow:
  target_mode: residual
  residual_mode: last_latent
  num_sampling_steps: 10
  noise_scale: 0.1
  deterministic_mean_eval: true
training:
  batch_size: 256
  max_epochs: 5
  max_train_batches: 80
  max_val_batches: 20
  save_every_steps: 20
  learning_rate: 0.0003
  weight_decay: 0.00001
  seed: 123
  grad_clip_norm: 1.0
  num_workers: 0
  device: auto
  run_root: runs
  best_metric: loss
sampling:
  num_samples: 8
  num_steps: 10
  noise_scale: 0.1
