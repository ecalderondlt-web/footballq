  max_iterations: 250
  tolerance_grad: 1.0e-8
  tolerance_change: 1.0e-10
  fit_seed: 7
  standardize_epsilon: 1.0e-8

evaluation:
  bootstrap_replicates: 5000
  bootstrap_seed: 20260729
  ece_bins: 10
  primary_target: penalty_area_action_10s
  secondary_target: turnover_5s

development_gate:
  minimum_primary_relative_nll_improvement: 0.005
  require_positive_primary_bootstrap_lower_bound: true
  minimum_positive_validation_matches: 2
  require_better_than_every_history_shuffle: true
  require_primary_brier_noninferiority: true
  minimum_secondary_relative_nll_change: -0.005
  require_integrity_audits: true

confirmation:
