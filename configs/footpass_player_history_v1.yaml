    y_min: 0.20352941176470588
    y_max: 0.7964705882352942
  require_query_outside_penalty_area: true
  minimum_active_players: 20

features:
  nearest_teammates: 5
  nearest_opponents: 5
  tracking_sample_stride_frames: 125
  coordinate_clip_min: -0.25
  coordinate_clip_max: 1.25
  velocity_clip_abs: 0.25
  history_support_caps: [1, 3, 5]
  main_history_support_cap: 3
  action_profile_classes: [1, 2, 3, 4, 5, 6, 7, 8]
