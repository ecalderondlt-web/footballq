model:
  name: mlp
  hidden_sizes: [256, 256]
  dropout: 0.1
data:
  windows: data/processed/synthetic_windows.pt
  batch_size: 64
  num_workers: 0
split:
  val_fraction: 0.25
  test_fraction: 0.25
training:
  seed: 7
  epochs: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  device: auto
  run_root: runs
