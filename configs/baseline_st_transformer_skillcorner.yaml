model:
  name: st_transformer
  d_model: 128
  n_heads: 4
  n_layers_temporal: 2
  n_layers_social: 2
  dropout: 0.1
data:
  windows: data/processed/skillcorner_windows.pt
  batch_size: 64
  num_workers: 0
split:
  val_fraction: 0.2
  test_fraction: 0.2
training:
  seed: 7
  epochs: 1
  learning_rate: 0.001
  weight_decay: 0.0001
  device: auto
  run_root: runs
