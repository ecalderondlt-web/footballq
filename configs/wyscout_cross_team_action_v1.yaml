experiment_protocol: wyscout_cross_team_pass_destination_v1

data:
  dataset_root: data/processed/wyscout_player_memory_v1
  dataset_manifest: data/processed/wyscout_player_memory_v1/manifest.json
  development_split_manifest: splits/wyscout_player_memory_development_v1.json
  confirmatory_split_manifest: splits/wyscout_player_memory_world_cup_confirmatory_v1.json
  confirmatory_support_manifest: splits/wyscout_player_fingerprint_club_to_world_cup_v1.json

development:
  support_competitions:
    - England
    - France
    - Germany
    - Italy
    - Spain
  support_end_dateutc_exclusive: "2018-01-01 00:00:00"
  train_query_competitions:
    - England
    - Germany
    - Italy
  validation_query_competitions:
    - Spain
  development_query_competitions:
    - France
  query_start_dateutc_inclusive: "2018-02-01 00:00:00"

confirmatory:
  support_competitions:
    - England
    - France
    - Germany
    - Italy
    - Spain
  query_competition: World_Cup
  status: metric_sealed

task:
  primary_outcome: destination_zone
  query_start_x_min: 50.0
  num_destination_zones: 30
  causal_context:
    - broad_role
    - current_start_zone

profiles:
  minimum_prior_matches: 5
  context_prior_strength: 100.0
  support_match_caps:
    - 3
    - 5
    - 10
    - 20
  main_support_match_cap: 20
  prior_strengths:
    - 5.0
    - 10.0
    - 20.0
    - 50.0
    - 100.0
  residual_ratio_limit: 4.0

falsification:
  shuffle_seeds:
    - 7
    - 11
    - 23
    - 41
    - 73
  shuffle_within:
    - support_team
    - broad_role

uncertainty:
  bootstrap_unit: match_id
  bootstrap_replicates: 5000
  confidence_level: 0.95
  seed: 20260729

development_gate:
  minimum_relative_penalty_nll_improvement: 0.0025
  require_positive_penalty_bootstrap_lower_bound: true
  require_penalty_brier_improvement: true
  require_penalty_average_precision_improvement: true
  require_better_than_all_same_team_role_shuffles: true
  require_main_cap_better_than_first_cap: true
