experiment: decoder_context_reconstruct_current_real
seed: 123
data:
  decoder_dataset: data/processed/skillcorner_decoder_dataset.pt
  batch_size: 256
  num_workers: 0
target:
  mode: reconstruct_current_from_z_context
model:
  name: z_context_mlp
  hidden_sizes: [512, 512]
  dropout: 0.1
  activation: relu
training:
  epochs: 10
  learning_rate: 0.0005
  weight_decay: 0.0001
  seed: 123
  grad_clip_norm: 1.0
  device: auto
  run_root: runs
  max_train_batches: 200
  max_eval_batches: 80
  best_metric: current_all_entity_error_m
