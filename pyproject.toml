[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "footballq"
version = "0.1.0"
description = "Phase 1 football tracking data foundation for trajectory modeling."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "footballq contributors" }]
dependencies = [
  "imageio>=2.34",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pillow>=10",
  "pyarrow>=15",
  "pydantic>=2.6",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
footballq = "footballq.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

